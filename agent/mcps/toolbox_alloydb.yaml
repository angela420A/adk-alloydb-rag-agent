sources:
  agentic_agent_kb:
    kind: "postgres"
    host: "127.0.0.1"
    port: "8888"
    database: "${ALLOYDB_DATABASE}"
    user: "postgres"
    password: "${TF_VAR_alloydb_password}"

tools:
  search_hotels_by_name:
    kind: postgres-sql
    source: agentic_agent_kb
    description: "Search for hotels based on name."
    parameters:
      - name: name
        type: string
        description: "The name of the hotel."
    statement: |
      SELECT * FROM hotels WHERE name ILIKE '%' || $1 || '%';

  search_hotels_by_location:
    kind: postgres-sql
    source: agentic_agent_kb
    description: "Search for hotels based on location."
    parameters:
      - name: location
        type: string
        description: "The location of the hotel."
    statement: |
      SELECT * FROM hotels WHERE location ILIKE '%' || $1 || '%';

  search_hotels_by_similarity:
    kind: postgres-sql
    source: agentic_agent_kb
    description: >-
      Semantic search for hotels using vector embeddings. Accepts a natural
      language query and returns the most similar hotels by cosine distance.
    parameters:
      - name: query
        type: string
        description: "Natural language search query, e.g. 'luxury hotel in Basel'."
    statement: |
      SELECT id, name, location, price_tier, checkin_date, checkout_date, booked,
             (embedding <=> embedding('gemini-embedding-2', $1)::vector) AS distance
      FROM hotels
      ORDER BY embedding <=> embedding('gemini-embedding-2', $1)::vector
      LIMIT 5;

  book_hotel:
    kind: postgres-sql
    source: agentic_agent_kb
    description: >-
      Book a hotel by its ID. If the hotel is successfully booked, returns a NULL,
      raises an error if not.
    parameters:
      - name: hotel_id
        type: string
        description: "The ID of the hotel to book."
    statement: |
      UPDATE hotels SET booked = B'1' WHERE id = $1;

  update_hotel:
    kind: postgres-sql
    source: agentic_agent_kb
    description: >-
      Update a hotel's check-in and check-out dates by its ID. Returns a message
      indicating whether the hotel was successfully updated or not.
    parameters:
      - name: hotel_id
        type: string
        description: "The ID of the hotel to update."
      - name: checkin_date
        type: string
        description: "The new check-in date of the hotel."
      - name: checkout_date
        type: string
        description: "The new check-out date of the hotel."
    statement: |
      UPDATE hotels
      SET checkin_date = CAST($2 AS date),
          checkout_date = CAST($3 AS date)
      WHERE id = $1;

  cancel_hotel:
    kind: postgres-sql
    source: agentic_agent_kb
    description: "Cancel a hotel by its ID."
    parameters:
      - name: hotel_id
        type: string
        description: "The ID of the hotel to cancel."
    statement: |
      UPDATE hotels SET booked = B'0' WHERE id = $1;

toolsets:
  hotel_toolset:
    - search_hotels_by_name
    - search_hotels_by_location
    - search_hotels_by_similarity
    - book_hotel
    - update_hotel
    - cancel_hotel
