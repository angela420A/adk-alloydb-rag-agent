sources:
  gamaplay_agent_kb_stag:
    kind: "postgres"
    host: "127.0.0.1"
    port: "8888"
    database: "${ALLOYDB_DATABASE}"
    user: "postgres"
    password: "${TF_VAR_alloydb_password}"

tools:
  search_faq_articles:
    kind: postgres-sql
    source: gamaplay_agent_kb_stag
    description: "Search FAQ articles by semantic text query using Vertex AI vector embeddings. Returns the top 5 most relevant articles with article IDs, titles, clean markdown content, hyperlinks, image URLs, and metadata including brand name, category name, and section name."
    parameters:
      - name: search_text
        type: string
        description: "The user query, problem description, or search keywords to find relevant FAQ articles."
    statement: |
      SELECT
        zendesk_article_id,
        title,
        content,
        hyperlinks,
        image_urls,
        metadata ->> 'brand_name' as brand_name,
        metadata ->> 'category_name' as category_name,
        metadata ->> 'section_name' as section_name
      FROM
        rag_kb_documents
      WHERE
        is_deleted = FALSE AND source_type = 'faq_articles'
      ORDER BY
        content_embedding <=> embedding('text-multilingual-embedding-002', $1)::vector
      LIMIT
        5;

toolsets:
  faq_toolset:
    - search_faq_articles