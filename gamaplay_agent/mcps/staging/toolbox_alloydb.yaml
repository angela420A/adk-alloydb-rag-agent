sources:
    agent_kb_db:
        kind: "alloydb-postgres"
        project: "${GOOGLE_CLOUD_PROJECT}"
        region: "${GOOGLE_CLOUD_LOCATION}"
        cluster: "${ALLOYDB_CLUSTER}"
        instance: "${ALLOYDB_INSTANCE}"
        ipType: "private"
        database: "${ALLOYDB_DATABASE}"
        user: "${ALLOYDB_USER}"
        password: "${ALLOYDB_PASSWORD}"

tools:
  search_document_by_context:
    kind: postgres-sql
    source: agent_kb_db
    description: Find document or article in the RAG Tables using language search and vector embeddings.
    parameters:
      - name: search_text
        type: string
        description: Description of the document or article the user is looking for.
    statement: |
      SELECT
        articles.zendesk_article_id,
        rag_documents.content,
        categories.name
      FROM 
        rag_documents
      JOIN articles
        on articles.id = rag_documents.source_id
      JOIN sections
        on sections.id = articles.section_id
      JOIN categories
        on categories.id = sections.category_id
      JOIN brands
        on brands.id = categories.brand_id
      ORDER BY
        rag_documents.content_embedding <=> embedding('text-multilingual-embedding-002', $1)::vector
      LIMIT 5;
  search_categories:
    kind: postgres-sql
    source: agent_kb_db
    description: Retrieve all available article categories from the database.
    statement: |
      SELECT name FROM categories;


toolsets:
   supply_chain_toolset:
     - search_document_by_context
     - search_categories